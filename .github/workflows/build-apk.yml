name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Baixar modelo de gestos (MediaPipe)
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 -o app/src/main/assets/gesture_recognizer.task \
            https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/latest/gesture_recognizer.task
          ls -l app/src/main/assets

      - name: Compilar APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk teleprompter.apk

      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: teleprompter-apk
          path: teleprompter.apk

      - name: Publicar na página de Releases (link direto para o celular)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest teleprompter.apk \
            --title "Teleprompter – versão mais recente" \
            --notes "APK gerado automaticamente a partir do commit ${GITHUB_SHA::7}."
